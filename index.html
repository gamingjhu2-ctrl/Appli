<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Documents</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css?v=1">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  
  <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>
</head>
<body>
  <header>
    <h1>📚 Mes Documents</h1>
    <div class="actions">
      <button id="addNoteBtn" class="btn-add">➕ Nouvelle Note</button>
      <button id="addTableBtn" class="btn-add">➕ Coller un Tableau</button>
    </div>
  </header>
  <main id="app"></main>

  <div id="modalNote" class="modal hidden">
    <div class="modal-content">
      <h2>Nouvelle Note</h2>
      <input type="text" id="noteTitle" placeholder="Titre de la note">
      <textarea id="noteContent" placeholder="Écris ton texte ici..." rows="10"></textarea>
      <div class="modal-actions">
        <button onclick="closeModals()" class="btn-cancel">Annuler</button>
        <button onclick="saveNote()" class="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <div id="modalTable" class="modal hidden">
    <div class="modal-content">
      <h2>Coller un Tableau</h2>
      <p style="font-size: 0.9rem; margin-bottom: 10px; color: #666;">
        Copie ton tableau depuis Excel et colle-le (Ctrl+V) dans la zone ci-dessous :
      </p>
      <input type="text" id="tableTitle" placeholder="Titre du tableau">
      <textarea id="tableContent" placeholder="Colle ton tableau ici..." rows="10"></textarea>
      <div class="modal-actions">
        <button onclick="closeModals()" class="btn-cancel">Annuler</button>
        <button onclick="saveTable()" class="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=1"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
